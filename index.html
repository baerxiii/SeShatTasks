<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SeShat Command</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#020617;
    --bg2:#0f172a;
    --card:rgba(255,255,255,.05);
    --border:rgba(255,255,255,.08);
    --text:#f8fafc;
    --muted:#94a3b8;
    --accent:#38bdf8;
    --success:#22c55e;
    --danger:#ef4444;
    --warning:#f59e0b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:
        radial-gradient(circle at top left,#2563eb 0%,transparent 30%),
        radial-gradient(circle at bottom right,#7c3aed 0%,transparent 30%),
        linear-gradient(135deg,var(--bg),var(--bg2));
    color:var(--text);
    min-height:100vh;
    padding:25px;
}

.container{
    max-width:1200px;
    margin:auto;
}

header{
    text-align:center;
    margin-bottom:30px;
}

header h1{
    font-size:3rem;
}

header p{
    color:var(--muted);
    margin-top:10px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:var(--card);
    backdrop-filter:blur(12px);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
}

.stat-number{
    font-size:2rem;
    font-weight:700;
    color:var(--accent);
}

#todayCount{
    color:var(--success);
}

#overdueCount{
    color:var(--danger);
}

.panel{
    background:var(--card);
    backdrop-filter:blur(12px);
    border:1px solid var(--border);
    border-radius:20px;
    padding:25px;
    margin-bottom:25px;
}

h2{
    margin-bottom:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr auto;
    gap:10px;
}

input,
select,
textarea{
    border:none;
    border-radius:12px;
    padding:14px;
}

textarea{
    width:100%;
    margin-top:12px;
    min-height:100px;
    resize:vertical;
}

button{
    border:none;
    cursor:pointer;
}

.add-btn{
    background:var(--accent);
    color:white;
    padding:14px 20px;
    border-radius:12px;
    font-weight:600;
}

.search{
    width:100%;
    margin-bottom:25px;
}

.task-list{
    display:grid;
    gap:15px;
}

.task{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
}

.task.completed{
    opacity:.6;
}

.task.completed .task-title{
    text-decoration:line-through;
}

.task-header{
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.task-title{
    font-size:1.1rem;
    font-weight:600;
}

.task-meta{
    color:var(--muted);
    margin-top:8px;
    line-height:1.5;
}

.notes{
    margin-top:12px;
    color:#dbeafe;
}

.badge{
    display:inline-block;
    margin-top:10px;
    padding:5px 10px;
    border-radius:999px;
    font-size:.8rem;
}

.high{
    background:#7f1d1d;
}

.medium{
    background:#78350f;
}

.low{
    background:#14532d;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.complete-btn{
    background:var(--success);
    color:white;
    padding:8px 12px;
    border-radius:10px;
}

.edit-btn{
    background:var(--warning);
    color:white;
    padding:8px 12px;
    border-radius:10px;
}

.delete-btn{
    background:var(--danger);
    color:white;
    padding:8px 12px;
    border-radius:10px;
}

.empty{
    text-align:center;
    color:var(--muted);
    padding:30px;
}

@media(max-width:768px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .task-header{
        flex-direction:column;
    }

}

</style>
</head>
<body>

<div class="container">

<header>
    <h1>✅ SeShat Command</h1>
    <p>Your Personal Task & Goal Management System</p>
</header>

<div class="stats">

    <div class="stat">
        <div id="totalCount" class="stat-number">0</div>
        <div>Total Tasks</div>
    </div>

    <div class="stat">
        <div id="openCount" class="stat-number">0</div>
        <div>Open Tasks</div>
    </div>

    <div class="stat">
        <div id="completedCount" class="stat-number">0</div>
        <div>Completed</div>
    </div>

    <div class="stat">
        <div id="todayCount" class="stat-number">0</div>
        <div>Due Today</div>
    </div>

    <div class="stat">
        <div id="overdueCount" class="stat-number">0</div>
        <div>Overdue</div>
    </div>

</div>

<div class="panel">

    <h2>Add Task</h2>

    <div class="form-grid">

        <input id="taskName" type="text" placeholder="Task Name">

        <input id="taskDate" type="date">

        <select id="taskPriority">
            <option value="High">🔴 High</option>
            <option value="Medium" selected>🟡 Medium</option>
            <option value="Low">🟢 Low</option>
        </select>

        <select id="taskCategory">
            <option>Personal</option>
            <option>Financial</option>
            <option>Home</option>
            <option>Vehicle</option>
            <option>Health</option>
            <option>Project</option>
        </select>

        <button class="add-btn" onclick="addTask()">
            Add
        </button>

    </div>

    <textarea
        id="taskNotes"
        placeholder="Notes..."></textarea>

</div>

<input
    id="search"
    class="search"
    type="text"
    placeholder="🔍 Search Tasks..."
    oninput="renderTasks()">

<h2>Tasks</h2>

<div id="taskList" class="task-list"></div>

</div>

<script>

let tasks =
JSON.parse(localStorage.getItem("seshat_tasks")) || [];

function saveTasks(){
    localStorage.setItem(
        "seshat_tasks",
        JSON.stringify(tasks)
    );
}

function addTask(){

    const name =
        document.getElementById("taskName").value.trim();

    if(!name){
        alert("Enter a task name.");
        return;
    }

    tasks.unshift({
        id:Date.now(),
        name:name,
        date:document.getElementById("taskDate").value,
        priority:document.getElementById("taskPriority").value,
        category:document.getElementById("taskCategory").value,
        notes:document.getElementById("taskNotes").value.trim(),
        completed:false
    });

    clearForm();
    saveTasks();
    renderTasks();
}

function clearForm(){

    document.getElementById("taskName").value="";
    document.getElementById("taskDate").value="";
    document.getElementById("taskNotes").value="";
    document.getElementById("taskPriority").value="Medium";
}

function toggleTask(id){

    const task =
    tasks.find(t=>t.id===id);

    task.completed=!task.completed;

    saveTasks();
    renderTasks();
}

function deleteTask(id){

    if(!confirm("Delete this task?")) return;

    tasks =
    tasks.filter(t=>t.id!==id);

    saveTasks();
    renderTasks();
}

function editTask(id){

    const task =
    tasks.find(t=>t.id===id);

    if(!task) return;

    const newName =
    prompt("Task Name",task.name);

    if(newName===null) return;

    const newNotes =
    prompt("Notes",task.notes || "");

    task.name=newName.trim();
    task.notes=newNotes || "";

    saveTasks();
    renderTasks();
}

function updateStats(){

    const today =
    new Date().toISOString().split('T')[0];

    document.getElementById("totalCount")
    .textContent = tasks.length;

    document.getElementById("openCount")
    .textContent =
    tasks.filter(
        t=>!t.completed
    ).length;

    document.getElementById("completedCount")
    .textContent =
    tasks.filter(
        t=>t.completed
    ).length;

    document.getElementById("todayCount")
    .textContent =
    tasks.filter(
        t=>!t.completed &&
        t.date===today
    ).length;

    document.getElementById("overdueCount")
    .textContent =
    tasks.filter(
        t=>!t.completed &&
        t.date &&
        t.date < today
    ).length;
}

function renderTasks(){

    const search =
    document.getElementById("search")
    .value.toLowerCase();

    const today =
    new Date().toISOString().split('T')[0];

    const list =
    document.getElementById("taskList");

    list.innerHTML="";

    const filtered =
    tasks
    .filter(t =>
        t.name.toLowerCase().includes(search)
    )
    .sort((a,b)=>{

        if(a.completed!==b.completed)
            return a.completed - b.completed;

        const aOver =
            a.date && a.date < today;

        const bOver =
            b.date && b.date < today;

        if(aOver!==bOver)
            return bOver - aOver;

        return (a.date || "9999")
            .localeCompare(
                b.date || "9999"
            );
    });

    if(filtered.length===0){

        list.innerHTML=
        '<div class="empty">No Tasks Found</div>';

        updateStats();
        return;
    }

    filtered.forEach(task=>{

        const card =
        document.createElement("div");

        card.className =
        task.completed
        ? "task completed"
        : "task";

        card.innerHTML = `
            <div class="task-header">

                <div>

                    <div class="task-title">
                        ${task.name}
                    </div>

                    <div class="task-meta">
                        📁 ${task.category}<br>
                        📅 ${task.date || "No Due Date"}
                    </div>

                    <div class="badge ${task.priority.toLowerCase()}">
                        ${task.priority}
                    </div>

                    ${
                        task.notes
                        ?
                        `<div class="notes">${task.notes}</div>`
                        :
                        ''
                    }

                </div>

                <div class="actions">

                    <button
                        class="complete-btn"
                        onclick="toggleTask(${task.id})">

                        ${task.completed ? 'Undo' : 'Complete'}

                    </button>

                    <button
                        class="edit-btn"
                        onclick="editTask(${task.id})">

                        Edit

                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteTask(${task.id})">

                        Delete

                    </button>

                </div>

            </div>
        `;

        list.appendChild(card);

    });

    updateStats();
}

renderTasks();

</script>

</body>
</html>
