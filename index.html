<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SeShat Command</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#030712;
    --bg2:#111827;
    --card:rgba(255,255,255,.05);
    --border:rgba(255,255,255,.1);
    --text:#f8fafc;
    --muted:#94a3b8;
    --accent:#38bdf8;
    --success:#22c55e;
    --danger:#ef4444;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:
        radial-gradient(circle at top left,#1d4ed8 0%,transparent 30%),
        radial-gradient(circle at bottom right,#7c3aed 0%,transparent 30%),
        linear-gradient(135deg,var(--bg),var(--bg2));
    color:var(--text);
    min-height:100vh;
    padding:25px;
}

.container{
    max-width:1200px;
    margin:auto;
}

header{
    text-align:center;
    margin-bottom:30px;
}

header h1{
    font-size:3rem;
}

header p{
    color:var(--muted);
    margin-top:10px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:var(--card);
    backdrop-filter:blur(12px);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
}

.stat-number{
    font-size:2rem;
    font-weight:700;
    color:var(--accent);
}

.form-section{
    background:var(--card);
    backdrop-filter:blur(12px);
    border:1px solid var(--border);
    border-radius:20px;
    padding:25px;
    margin-bottom:25px;
}

.form-grid{
    display:grid;
    grid-template-columns:2fr 1fr 1fr auto;
    gap:10px;
}

input,select{
    border:none;
    padding:14px;
    border-radius:12px;
    background:white;
}

button{
    border:none;
    cursor:pointer;
}

.add-btn{
    background:var(--accent);
    color:white;
    padding:14px 20px;
    border-radius:12px;
    font-weight:600;
}

.search{
    width:100%;
    margin-bottom:25px;
}

.task-list{
    display:grid;
    gap:15px;
}

.task{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
}

.task.completed{
    opacity:.6;
}

.task-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.task-title{
    font-size:1.1rem;
    font-weight:600;
}

.task.completed .task-title{
    text-decoration:line-through;
}

.task-meta{
    color:var(--muted);
    margin-top:8px;
    font-size:.9rem;
}

.priority{
    display:inline-block;
    padding:5px 10px;
    border-radius:999px;
    font-size:.8rem;
    margin-top:10px;
}

.high{
    background:#7f1d1d;
}

.medium{
    background:#78350f;
}

.low{
    background:#14532d;
}

.actions{
    display:flex;
    gap:10px;
}

.complete{
    background:var(--success);
    color:white;
    padding:8px 12px;
    border-radius:8px;
}

.delete{
    background:var(--danger);
    color:white;
    padding:8px 12px;
    border-radius:8px;
}

.section-title{
    margin-bottom:15px;
}

@media(max-width:768px){

.form-grid{
    grid-template-columns:1fr;
}

.task-top{
    flex-direction:column;
}

.actions{
    width:100%;
}

.actions button{
    flex:1;
}

}

</style>
</head>
<body>

<div class="container">

<header>
    <h1>✅ SeShat Command</h1>
    <p>Your Personal Task & Goal Management System</p>
</header>

<div class="stats">

    <div class="stat">
        <div class="stat-number" id="totalTasks">0</div>
        <div>Total Tasks</div>
    </div>

    <div class="stat">
        <div class="stat-number" id="openTasks">0</div>
        <div>Open Tasks</div>
    </div>

    <div class="stat">
        <div class="stat-number" id="completedTasks">0</div>
        <div>Completed</div>
    </div>

</div>

<div class="form-section">

    <h2 class="section-title">Add Task</h2>

    <div class="form-grid">

        <input
            id="taskName"
            type="text"
            placeholder="Enter task name">

        <input
            id="taskDate"
            type="date">

        <select id="taskPriority">
            <option>High</option>
            <option selected>Medium</option>
            <option>Low</option>
        </select>

        <button
            class="add-btn"
            onclick="addTask()">
            Add
        </button>

    </div>

</div>

<input
    id="search"
    class="search"
    type="text"
    placeholder="🔍 Search tasks..."
    onkeyup="renderTasks()">

<h2 class="section-title">Tasks</h2>

<div id="taskList" class="task-list"></div>

</div>

<script>

let tasks =
JSON.parse(localStorage.getItem("seshatTasks"))
|| [];

function saveTasks(){

    localStorage.setItem(
        "seshatTasks",
        JSON.stringify(tasks)
    );

}

function addTask(){

    const name =
    document.getElementById("taskName").value.trim();

    const date =
    document.getElementById("taskDate").value;

    const priority =
    document.getElementById("taskPriority").value;

    if(!name){
        alert("Enter a task name");
        return;
    }

    tasks.unshift({
        id:Date.now(),
        name,
        date,
        priority,
        completed:false
    });

    saveTasks();
    renderTasks();

    document.getElementById("taskName").value="";
    document.getElementById("taskDate").value="";
}

function toggleTask(id){

    const task =
    tasks.find(t => t.id === id);

    task.completed =
    !task.completed;

    saveTasks();
    renderTasks();

}

function deleteTask(id){

    if(!confirm("Delete task?"))
        return;

    tasks =
    tasks.filter(t => t.id !== id);

    saveTasks();
    renderTasks();

}

function renderTasks(){

    const search =
    document.getElementById("search")
    .value.toLowerCase();

    const list =
    document.getElementById("taskList");

    list.innerHTML = "";

    let filtered =
    tasks.filter(t =>
        t.name
        .toLowerCase()
        .includes(search)
    );

    filtered.forEach(task => {

        const card =
        document.createElement("div");

        card.className =
        task.completed
        ? "task completed"
        : "task";

        const priorityClass =
        task.priority.toLowerCase();

        card.innerHTML = `
        <div class="task-top">

            <div>

                <div class="task-title">
                    ${task.name}
                </div>

                <div class="task-meta">
                    Due:
                    ${task.date || "No Due Date"}
                </div>

                <div class="priority ${priorityClass}">
                    ${task.priority}
                </div>

            </div>

            <div class="actions">

                <button
                    class="complete"
                    onclick="toggleTask(${task.id})">

                    ${task.completed
                        ? "Undo"
                        : "Complete"}

                </button>

                <button
                    class="delete"
                    onclick="deleteTask(${  Delete

                </button>

            </div>

        </div>
        `;

        list.appendChild(card);

    });

    document.getElementById(
        "totalTasks"
    ).innerText =
    tasks.length;

    document.getElementById(
        "completedTasks"
    ).innerText =
    tasks.filter(t =>
        t.completed
    ).length;

    document.getElementById(
        "openTasks"
    ).innerText =
    tasks.filter(t =>
        !t.completed
    ).length;

}

renderTasks();

</script>

</body>
</html>
