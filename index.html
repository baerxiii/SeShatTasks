<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SeShat Command</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#020617;
    --bg2:#0f172a;
    --card:rgba(255,255,255,.05);
    --border:rgba(255,255,255,.1);
    --text:#f8fafc;
    --muted:#94a3b8;
    --accent:#38bdf8;
    --success:#22c55e;
    --danger:#ef4444;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:
        radial-gradient(circle at top left,#2563eb 0%,transparent 30%),
        radial-gradient(circle at bottom right,#7c3aed 0%,transparent 30%),
        linear-gradient(135deg,var(--bg),var(--bg2));
    color:var(--text);
    min-height:100vh;
    padding:25px;
}

.container{
    max-width:1200px;
    margin:auto;
}

header{
    text-align:center;
    margin-bottom:30px;
}

header h1{
    font-size:3rem;
}

header p{
    color:var(--muted);
    margin-top:10px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.stat{
    background:var(--card);
    border:1px solid var(--border);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:20px;
}

.stat-number{
    color:var(--accent);
    font-size:2rem;
    font-weight:700;
}

.panel{
    background:var(--card);
    border:1px solid var(--border);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:25px;
    margin-bottom:25px;
}

.panel h2{
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:2fr 1fr 1fr auto;
    gap:12px;
}

input,select{
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:15px;
}

.add-btn{
    background:var(--accent);
    color:white;
    border:none;
    border-radius:12px;
    cursor:pointer;
    padding:14px 24px;
    font-weight:600;
}

.search{
    width:100%;
    margin-bottom:25px;
}

.task-list{
    display:grid;
    gap:15px;
}

.task{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
}

.task.completed{
    opacity:.6;
}

.task.completed .task-title{
    text-decoration:line-through;
}

.task-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
}

.task-title{
    font-size:1.1rem;
    font-weight:600;
}

.task-meta{
    color:var(--muted);
    margin-top:8px;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:999px;
    margin-top:10px;
    font-size:.8rem;
}

.high{
    background:#7f1d1d;
}

.medium{
    background:#78350f;
}

.low{
    background:#14532d;
}

.actions{
    display:flex;
    gap:10px;
}

.complete-btn{
    background:var(--success);
    color:white;
    border:none;
    border-radius:10px;
    padding:8px 14px;
    cursor:pointer;
}

.delete-btn{
    background:var(--danger);
    color:white;
    border:none;
    border-radius:10px;
    padding:8px 14px;
    cursor:pointer;
}

.empty{
    color:var(--muted);
    text-align:center;
    padding:30px;
}

@media(max-width:768px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .task-header{
        flex-direction:column;
    }

}

</style>
</head>
<body>

<div class="container">

<header>
    <h1>✅ SeShat Command</h1>
    <p>Your Personal Task & Goal Management System</p>
</header>

<div class="stats">

    <div class="stat">
        <div class="stat-number" id="totalCount">0</div>
        <div>Total Tasks</div>
    </div>

    <div class="stat">
        <div class="stat-number" id="openCount">0</div>
        <div>Open Tasks</div>
    </div>

    <div class="stat">
        <div class="stat-number" id="completedCount">0</div>
        <div>Completed Tasks</div>
    </div>

</div>

<div class="panel">

    <h2>Add Task</h2>

    <div class="form-grid">

        <input
            id="taskName"
            type="text"
            placeholder="Task name">

        <input
            id="taskDate"
            type="date">

        <select id="taskPriority">
            <option value="High">High</option>
            <option value="Medium" selected>Medium</option>
            <option value="Low">Low</option>
        </select>

        <button class="add-btn" onclick="addTask()">
            Add
        </button>

    </div>

</div>

<input
    id="search"
    class="search"
    type="text"
    placeholder="🔍 Search tasks..."
    oninput="renderTasks()">

<h2 style="margin-bottom:15px;">Tasks</h2>

<div id="taskList" class="task-list"></div>

</div>

<script>

let tasks = JSON.parse(
    localStorage.getItem("seshat_tasks")
) || [];

function saveTasks() {
    localStorage.setItem(
        "seshat_tasks",
        JSON.stringify(tasks)
    );
}

function addTask() {

    const name =
        document.getElementById("taskName")
        .value.trim();

    const date =
        document.getElementById("taskDate")
        .value;

    const priority =
        document.getElementById("taskPriority")
        .value;

    if(name === ""){
        alert("Please enter a task.");
        return;
    }

    tasks.unshift({
        id: Date.now(),
        name: name,
        date: date,
        priority: priority,
        completed: false
    });

    saveTasks();

    document.getElementById("taskName").value = "";
    document.getElementById("taskDate").value = "";

    renderTasks();
}

function toggleTask(id){

    tasks = tasks.map(task => {

        if(task.id === id){
            task.completed = !task.completed;
        }

        return task;
    });

    saveTasks();
    renderTasks();
}

function deleteTask(id){

    if(!confirm("Delete this task?")){
        return;
    }

    tasks = tasks.filter(task => task.id !== id);

    saveTasks();
    renderTasks();
}

function updateStats(){

    document.getElementById("totalCount").textContent =
        tasks.length;

    document.getElementById("openCount").textContent =
        tasks.filter(t => !t.completed).length;

    document.getElementById("completedCount").textContent =
        tasks.filter(t => t.completed).length;
}

function renderTasks(){

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const container =
        document.getElementById("taskList");

    container.innerHTML = "";

    const filtered =
        tasks.filter(task =>
            task.name.toLowerCase().includes(search)
        );

    if(filtered.length === 0){

        container.innerHTML =
            '<div class="empty">No tasks found.</div>';

        updateStats();
        return;
    }

    filtered.forEach(task => {

        const card =
            document.createElement("div");

        card.className =
            "task" +
            (task.completed ? " completed" : "");

        card.innerHTML = `
            <div class="task-header">

                <div>
                    <div class="task-title">
                        ${task.name}
                    </div>

                    <div class="task-meta">
                        Due:
                        ${task.date || "No Due Date"}
                    </div>

                    <div class="badge ${task.priority.toLowerCase()}">
                        ${task.priority}
                    </div>
                </div>

                <div class="actions">
                    <button
                        class="complete-btn"
                        onclick="toggleTask(${task.id})">
                        ${task.completed ? "Undo" : "Complete"}
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteTask(${task.id})">
                        Delete
            rd);
    });

    updateStats();
}

renderTasks();

</script>

</body>
</html>
